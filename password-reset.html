<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7fb" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>비밀번호 재설정 · 키온 key:on</title>
    <link rel="icon" type="image/svg+xml" href="/keyon-icon.svg?v=1" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/ui-system.css" />
    <link rel="stylesheet" href="/password-reset.css" />
  </head>
  <body>
    <main class="shell recovery-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="키온(key:on) 홈"><span class="brand-wordmark" aria-hidden="true">key<span class="brand-colon">:</span><span class="brand-on">on</span></span></a>
      </header>
      <section class="panel recovery-card" aria-labelledby="recoveryTitle">
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h1 id="recoveryTitle" tabindex="-1">비밀번호 재설정</h1>
        <p id="recoveryDescription" class="muted">가입한 이메일로 새 비밀번호를 설정할 수 있는 링크를 보내드려요.</p>
        <p id="recoveryStatus" class="message" role="status" aria-live="polite">재설정 화면을 준비하고 있습니다…</p>

        <form id="resetRequestForm" hidden>
          <label for="recoveryEmail">가입한 이메일</label>
          <input id="recoveryEmail" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com" />
          <button id="sendResetButton" type="submit" class="button button-wide" disabled>재설정 링크 보내기</button>
          <p id="requestMessage" class="message" role="status" aria-live="polite"></p>
          <p class="recovery-hint muted">메일이 보이지 않으면 스팸함을 확인해 주세요. 여러 번 요청했다면 가장 최근에 받은 링크를 열어 주세요.</p>
        </form>

        <form id="newPasswordForm" hidden>
          <p id="recoveryAccount" class="recovery-account"></p>
          <label for="newPassword">새 비밀번호</label>
          <input id="newPassword" name="new-password" type="password" autocomplete="new-password" minlength="8" required placeholder="8자 이상" aria-describedby="passwordHelp" />
          <label for="confirmPassword">새 비밀번호 확인</label>
          <input id="confirmPassword" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required placeholder="새 비밀번호를 한 번 더 입력해 주세요" />
          <label class="password-visibility"><input id="showPassword" type="checkbox" />비밀번호 표시</label>
          <p id="passwordHelp" class="recovery-hint muted">다른 서비스에서 사용하지 않는 비밀번호를 권장합니다.</p>
          <button id="savePasswordButton" type="submit" class="button button-wide">새 비밀번호 저장</button>
          <p id="passwordMessage" class="message" role="status" aria-live="polite"></p>
        </form>

        <a class="button button-quiet button-wide recovery-back" href="/">키온으로 돌아가기</a>
        <noscript><p class="message error">비밀번호를 재설정하려면 브라우저의 자바스크립트를 켜 주세요.</p></noscript>
      </section>
    </main>
    <footer class="recovery-footer">© 2026 뷰티지니 그리고 핑플피. All rights reserved.</footer>
    <script src="/config.js"></script>
    <script type="module" src="/password-reset.js"></script>
  </body>
</html>
