<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>키온 key:on — 키워드 탐색부터 내 블로그 분석까지</title>
  <rect width="1200" height="630" fill="#f7f7fb"/>
  <rect x="28" y="28" width="1144" height="574" rx="28" fill="#fff" stroke="#e8e4f3" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="600" y="119" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="26" font-weight="600" fill="#7256d8">블로거와 인플루언서를 위한 키워드 도구</text>
    <text x="600" y="291" font-family="DM Sans, Helvetica Neue, sans-serif" font-size="166" font-weight="700" letter-spacing="-9" fill="#20222b">key<tspan fill="#9690a3">:</tspan><tspan fill="#7256d8">on</tspan></text>
